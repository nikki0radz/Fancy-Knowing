<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101426"><title>Fancy Knowing · A little more curious</title><style>
:root{color-scheme:dark;--bg:#101426;--panel:#1a2037;--card:#1d2540;--text:#f8f5f3;--muted:#a3abc3;--pink:#ed96bc;--line:#ffffff16;--mint:#85e6ba;--input:#141a2e;--shadow:#0002}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-rounded,'Segoe UI',system-ui,sans-serif;font-size:15px}button,input,textarea{font:inherit}button,a,input{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit;border:0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:4px}button:disabled{cursor:default;opacity:.6}a{color:var(--pink)}[hidden]{display:none!important}.app{max-width:490px;margin:auto;padding:28px 24px 110px;min-height:100svh}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:750;letter-spacing:-1px}.logo{background:var(--pink);color:#242036;display:grid;place-items:center;width:37px;height:37px;border-radius:13px;font-size:27px}.round{height:43px;width:43px;border:1px solid var(--line);border-radius:50%;background:var(--panel);font-size:20px}.eyebrow{font-size:10px;letter-spacing:.15em;font-weight:750;color:var(--muted);text-transform:uppercase}h1{font-size:39px;line-height:1.12;letter-spacing:-1.6px;margin:12px 0}h1 em{font-style:normal;color:var(--pink)}.intro{color:var(--muted);line-height:1.6;font-size:14px;margin:12px 0 25px}.date{display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:var(--mint)}.card{border-radius:28px;background:var(--card);padding:25px;box-shadow:0 16px 40px var(--shadow);border:1px solid var(--line)}.cardtop{display:flex;align-items:center;justify-content:space-between}.topic{font-size:11px;color:#a7dcd6;padding:7px 10px;border-radius:30px;background:#70d8ce15}.save{background:transparent;font-size:25px;color:var(--pink);min-height:44px;min-width:44px}.question{font-size:28px;letter-spacing:-.7px;line-height:1.26;margin:24px 0}.mode{display:flex;gap:16px;margin-bottom:17px}.mode button{padding:8px 0;background:transparent;color:var(--muted);font-size:12px;border-bottom:2px solid transparent}.mode button[aria-pressed=true]{color:var(--pink);border-color:var(--pink)}.answers{display:grid;gap:10px}.answer{display:flex;align-items:center;gap:12px;text-align:left;padding:13px;border-radius:15px;background:var(--input);border:1px solid var(--line);min-height:53px;font-size:14px}.answer .letter{display:grid;place-items:center;flex:none;width:27px;height:27px;background:var(--panel);border-radius:9px;color:var(--muted);font-size:11px}.answer:hover:not(:disabled){border-color:var(--pink)}.answer.correct{background:#85e6ba16;border-color:var(--mint);opacity:1}.answer.wrong{background:#ed96bc14;border-color:var(--pink);opacity:1}.answer.correct .letter{color:var(--mint)}.smallnote{color:var(--muted);font-size:11px;line-height:1.6;margin:18px 0 0}.result{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}.result strong{color:var(--mint);font-size:17px}.result p{line-height:1.6;font-size:14px}.result a{font-size:11px}.heartrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);padding:16px 18px;border-radius:20px;margin:17px 0;width:100%;text-align:left}.heartrow .icon{font-size:27px;color:var(--pink)}.heartrow strong{display:block;font-size:13px}.heartrow small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:28px 0 13px}.sectionhead h2{font-size:20px;margin:0;letter-spacing:-.4px}.badge{font-size:10px;background:#b5a3f018;color:#b5a3f0;padding:6px 9px;border-radius:20px}.suggestions{display:grid;gap:8px}.suggestions button{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;text-align:left;font-size:13px;display:flex;justify-content:space-between;gap:12px}.suggestions button span{color:var(--pink)}.ask{display:flex;align-items:center;justify-content:space-between;background:var(--input);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;width:100%;color:var(--muted);text-align:left;font-size:13px}.ask span{color:var(--pink);font-size:20px}.done{text-align:center;color:var(--muted);font-size:12px;margin:24px 0}.textbtn{color:var(--pink);background:transparent;font-size:12px;padding:10px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,490px);display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--bg);padding:12px 12px max(16px,env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:var(--muted);font-size:10px;display:flex;align-items:center;gap:5px;flex-direction:column;min-width:70px;padding:4px}.nav button span{font-size:21px}.nav button[aria-current=page]{color:var(--pink)}.demo{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:24px;line-height:1.5}.bankitem{background:var(--panel);padding:20px;border:1px solid var(--line);border-radius:20px;margin:12px 0}.bankitem p{line-height:1.5}.bankitem small{color:var(--muted)}.primary{border-radius:99px;background:linear-gradient(115deg,#ed96bc,#b59be3);color:#251a35;padding:15px 24px;font-weight:700;width:100%;margin-top:14px}.setting{padding:20px 0;border-bottom:1px solid var(--line)}.setting label{display:flex;justify-content:space-between;align-items:center;gap:16px}.setting p{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0}.setting input[type=time],.field{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--input);color:var(--text);max-width:100%;font-size:16px}.setting input[type=checkbox]{accent-color:#ed96bc;width:23px;height:23px}.field{width:100%}.empty{padding:30px 20px;text-align:center;color:var(--muted);line-height:1.7}.empty span{display:block;font-size:40px;color:var(--pink)}dialog{padding:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:25px;width:min(94vw,460px);max-height:88svh}dialog::backdrop{background:#090c1ac9;backdrop-filter:blur(5px)}.dialoginner{padding:23px}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px}.dialoghead h2{font-size:22px}.messages{display:flex;flex-direction:column;gap:12px;max-height:43svh;overflow:auto;padding:18px 0}.message{line-height:1.65;font-size:14px;border-radius:18px;padding:14px 16px;background:var(--panel);max-width:95%;white-space:pre-wrap}.message.user{align-self:flex-end;background:#ed96bc20}.chatform{display:flex;gap:9px}.chatform input{min-width:0;flex:1}.chatform button{width:45px;border-radius:14px;background:var(--pink);color:#242036;font-size:20px}.notification{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:20px;margin:16px 0}.notification p{font-size:15px;line-height:1.5}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);max-width:90vw;background:var(--pink);color:#251a35;border-radius:15px;padding:13px 19px;font-size:12px;z-index:20;box-shadow:0 8px 30px #0003}.light{color-scheme:light;--bg:#f4f1f7;--panel:#fff;--card:#e7e2ef;--text:#27243a;--muted:#626078;--pink:#a7356d;--line:#29233920;--mint:#197851;--input:#f7f4fa;--shadow:#756b8a0d}.light .topic{color:#24746c}.light .badge{color:#7050a0}.light .primary{color:#251a35}.light .chatform button,.light .logo{color:#fff}.light .toast{color:#fff}@media(min-width:700px){.app{padding-top:42px}.card{padding:28px}}@media(prefers-reduced-motion:no-preference){.card{animation:arrive .3s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}

.authform{display:grid;gap:12px}.authform label{font-size:12px;color:var(--muted);display:grid;gap:7px}.authform .primary{margin-top:5px}.error{color:var(--pink);font-size:13px;line-height:1.6}.auth-tabs{display:flex;gap:20px;margin:25px 0}.auth-tabs button{background:transparent;padding:10px 0;color:var(--muted);border-bottom:2px solid transparent}.auth-tabs [aria-pressed=true]{color:var(--pink);border-color:var(--pink)}.loading{min-height:240px;display:grid;place-content:center;text-align:center;color:var(--muted);line-height:1.8}.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--pink);border-radius:50%;margin:0 auto 18px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.accountname{font-size:12px;color:var(--muted)}.due{width:100%;border:1px solid #ed96bc50;border-radius:16px;padding:15px;text-align:left;background:#ed96bc12;color:var(--pink);margin:0 0 20px}.tabbar{display:flex;gap:9px;margin:18px 0}.tabbar button{background:var(--panel);color:var(--muted);padding:10px 18px;border-radius:99px}.tabbar button[aria-pressed=true]{color:var(--pink);border:1px solid var(--pink)}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style></head><body><main class="app"><header><div class="brand"><span class="logo" aria-hidden="true">✳</span>Fancy Knowing<span style="color:var(--pink)">.</span></div><button class="round" id="theme" aria-label="Switch colour theme">☼</button></header><section id="auth" hidden></section><section id="today"><div class="loading"><div class="spinner"></div>Getting things ready…</div></section><section id="bank" hidden></section><section id="settings" hidden></section></main><nav class="nav" aria-label="Main navigation" id="nav" hidden><button data-page="today" aria-current="page"><span>✳</span>Today</button><button data-page="bank"><span>♡</span>Your bank</button><button data-page="settings"><span>⚙</span>Settings</button></nav><dialog id="chat"><div class="dialoginner"><div class="dialoghead"><div><div class="eyebrow">FOLLOW YOUR CURIOSITY</div><h2>Dive a little deeper.</h2></div><button class="round" id="closechat" aria-label="Close chat">×</button></div><div class="messages" id="messages" role="log" aria-live="polite"></div><form class="chatform" id="chatform"><input id="chatinput" class="field" placeholder="What are you curious about?" aria-label="Ask a follow-up" maxlength="1500" required><button id="sendchat" aria-label="Send question">↑</button></form><p class="smallnote" id="chaterror" role="status"></p></div></dialog><div class="toast" id="toast" role="status" hidden></div><script src="/app.js" defer></script></body></html>
