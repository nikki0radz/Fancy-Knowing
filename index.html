cent)}.font-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:15px 0}.font-card{background:var(--input);border:1px solid var(--line);padding:16px 8px;border-radius:16px;min-width:0}.font-card[aria-pressed=true]{border-color:var(--pink);background:color-mix(in srgb,var(--accent) 12%,var(--input))}.font-card span{display:block;font-size:24px;overflow-wrap:anywhere}.font-card small{display:block;color:var(--muted);font:11px system-ui;margin-top:8px}.colour-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.colour-slot{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;color:var(--text);font-size:calc(13px * var(--font-scale))}.colour-slot[aria-pressed=true]{border-color:var(--pink)}.colour-slot i,.colour-preview-row i{display:block;width:27px;height:27px;border:2px solid #ffffff70;border-radius:50%;flex-shrink:0}.colour-wheel{position:relative;margin:20px auto;width:min(65vw,260px,32dvh);aspect-ratio:1;border-radius:50%;touch-action:none;cursor:crosshair;background:radial-gradient(circle at center,#fff 0%,#fff0 70.71%),conic-gradient(from 90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);box-shadow:inset 0 0 0 1px #ffffff30,0 8px 30px #0003}.colour-wheel:after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:rgba(0,0,0,var(--wheel-darkness,0))}.colour-cursor{position:absolute;width:22px;height:22px;border:3px solid white;border-radius:50%;box-shadow:0 0 0 1px #333;transform:translate(-50%,-50%);pointer-events:none;z-index:1}.colour-preview-row{display:flex;align-items:center;gap:12px}.colour-preview-row input{max-width:160px;font-family:monospace!important}.colour-range{appearance:none;display:block;width:100%;height:12px;border:0;border-radius:999px}.colour-range::-webkit-slider-thumb{appearance:none;width:22px;height:22px;border:2px solid #333;border-radius:50%;background:white}.hue-range{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}.avatar-row{display:flex;align-items:center;gap:18px;margin:8px 0 22px}.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:var(--input);border:1px solid var(--line);display:grid;place-items:center;color:var(--pink);font-size:28px;flex-shrink:0}.picture-button{display:inline-block;cursor:pointer;color:var(--pink);font-size:calc(13px * var(--font-scale));padding:10px 0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.setting select{background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}.design-preview{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--card);line-height:1.6;margin:15px 0}.design-preview strong{color:var(--pink)}.light .topic,.light .badge{color:var(--pink)}@media(prefers-reduced-motion:reduce){.theme-slider i{transition:none}}

.theme-slider{--toggle-width:112px;--toggle-height:54px;--toggle-pad:5px;--toggle-thumb:42px;--toggle-travel:58px;--toggle-icon:27px;position:relative;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;width:var(--toggle-width);height:var(--toggle-height);min-width:var(--toggle-width);padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:var(--input);box-shadow:inset 0 1px 4px #00000014;overflow:hidden;isolation:isolate}
header .theme-slider{--toggle-width:88px;--toggle-height:42px;--toggle-pad:4px;--toggle-thumb:32px;--toggle-travel:46px;--toggle-icon:21px;padding:4px 6px}
.theme-slider .theme-thumb{position:absolute;top:var(--toggle-pad);left:var(--toggle-pad);width:var(--toggle-thumb);height:var(--toggle-thumb);border-radius:50%;background:#fff4d4;box-shadow:0 2px 7px #00000028,inset 0 1px 0 #ffffff99;transition:transform .3s cubic-bezier(.22,.8,.25,1),background .3s ease;z-index:0}
.theme-slider .theme-sun,.theme-slider .theme-moon{position:relative;display:grid;place-items:center;width:var(--toggle-thumb);height:var(--toggle-thumb);flex-shrink:0;z-index:1;transition:opacity .25s ease}
.theme-slider svg{width:var(--toggle-icon);height:var(--toggle-icon);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.theme-slider .theme-sun svg{fill:#f9b923;stroke:#d28a0d}
.theme-slider .theme-moon svg{fill:#25334e;stroke:#25334e}
.theme-slider[aria-checked=true] .theme-thumb{transform:translateX(var(--toggle-travel));background:#c5d0e6}
.theme-slider[aria-checked=true] .theme-sun{opacity:.5}
.theme-slider[aria-checked=false] .theme-moon{opacity:.45}
.theme-slider:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
@media(prefers-reduced-motion:reduce){.theme-slider .theme-thumb,.theme-slider .theme-sun,.theme-slider .theme-moon{transition:none}}

.secret-field{display:flex;align-items:stretch;width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--input);overflow:hidden}
.secret-field:focus-within{outline:2px solid var(--pink);outline-offset:3px}
.secret-field .field{flex:1;min-width:0;border:0;border-radius:0;background:transparent}
.secret-field .field:focus-visible{outline:none}
.secret-toggle{display:flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0;min-width:76px;min-height:44px;padding:10px 12px;background:transparent;color:var(--pink);font-size:calc(12px * var(--font-scale,1))}
.secret-toggle:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.secret-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.secret-toggle .secret-slash{display:none}
.secret-toggle[aria-pressed=true] .secret-slash{display:block}

body.chat-open{overflow:hidden}
#chat{position:fixed;inset:var(--chat-top,0px) 0 auto;margin:0;width:100%;height:var(--chat-height,100dvh);max-width:none;max-height:none;border:0;border-radius:0;padding:0;overscroll-behavior:contain}
#chat[open]{display:flex;flex-direction:column}
#chat::backdrop{background:var(--bg);backdrop-filter:none}
#chat .dialoginner{display:flex;flex-direction:column;width:min(100%,720px);height:100%;min-height:0;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom))}
#chat .dialoghead{flex:none;padding:0 0 16px;border-bottom:1px solid var(--line)}

#chat .messages{flex:1;min-height:0;max-height:none;overflow-y:auto;overscroll-behavior:contain;padding:22px 0;scrollbar-gutter:stable}
#chat .message{max-width:92%;flex-shrink:0;overflow-wrap:anywhere}
#chat .message.user{max-width:88%;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
#chat .message:not(.user){border-bottom-left-radius:6px}
#chat .chatform{flex:none;align-items:stretch;margin:0}
#chat .chatform .field{min-width:0}
#chat .chatform button{min-width:65px}
#chaterror:empty{display:none}
#chaterror{flex:none;margin:12px 0 0}
.thinking-dots{display:flex;gap:5px;padding:5px 0}
.thinking-dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:chat-dot 1.2s ease-in-out infinite}
.thinking-dots i:nth-child(2){animation-delay:.15s}.thinking-dots i:nth-child(3){animation-delay:.3s}
.is-typing:after{content:'';display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-.1em;background:var(--pink);animation:chat-cursor .8s step-end infinite}
@keyframes chat-dot{0%,70%,100%{opacity:.35;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
@keyframes chat-cursor{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.thinking-dots i,.is-typing:after{animation:none}}
